name: jigrotech
description: "A new Flutter project."
publish_to: 'none'    
version: 1.0.0+7

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg:
  pin_code_fields: ^8.0.0
  image_picker: any
  permission_handler: ^12.0.1
  flutter_contacts:
  dotted_border: ^2.0.0
  qr_flutter: ^4.1.0
  #qr_code_scanner:
  pdf:
  path_provider:
  open_file:
  url_launcher:
  intl: any
  table_calendar:
  fluttertoast:
  get:
  http:
  connectivity_plus:
  shared_preferences:
  screen_protector:
  razorpay_flutter:
  firebase_core:
  firebase_messaging:
  flutter_local_notifications: ^18.0.1
  awesome_notifications:
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  share_plus: ^13.3.0
  iconsax_plus: ^1.0.0
  smart_auth: ^3.2.0
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/jigropay.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/jigropay.png"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
  #   - family: Schyler
   - family: Outfit-Black
     fonts:
     - asset: assets/Outfit/Outfit/static/Outfit-Black.ttf
   - family: Outfit-Bold
     fonts:
     - asset: assets/Outfit/Outfit/static/Outfit-Bold.ttf

   - family: Outfit-Medium
     fonts:
     - asset: assets/Outfit/Outfit/static/Outfit-Medium.ttf
   - family: Outfit-Regular
     fonts:
     - asset: assets/Outfit/Outfit/static/Outfit-Regular.ttf
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
